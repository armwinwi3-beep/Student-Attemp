services:
  - type: web
    name: student-checkin
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        sync: false
      - key: LINE_LIFF_ID
        sync: false
      - key: LINE_LOGIN_CHANNEL_ID
        sync: false
      - key: SHEET_URL
        sync: false
      - key: SHEET_GID
        value: "0"
